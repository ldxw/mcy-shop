name: Release & Docker Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "输入版本号 (例如: 1.0.0)"
        required: true
        type: string
        default: "5.0.27"
      push_latest:
        description: "同时推送 latest 标签？"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: write
  packages: write

env:
  IMAGE_DH: ${{ secrets.DOCKER_USERNAME }}/mcy-shop
  IMAGE_GHCR: ghcr.io/${{ github.repository_owner }}/mcy-shop

jobs:
  release-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history + tags)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set version
        id: vars
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create ZIP package
        run: |
          VERSION=${{ github.event.inputs.version }}
          ZIP_NAME="mcy-shop_${VERSION}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "rootfs/*" \
            -x "docs/*"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release ${{ steps.vars.outputs.VERSION }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tagcalc
        run: |
          VERSION=${{ steps.vars.outputs.VERSION }}
          {
            echo "TAGS<<EOF"
            echo "${{ env.IMAGE_DH }}:${VERSION}"
            echo "${{ env.IMAGE_GHCR }}:${VERSION}"
            if [ "${{ github.event.inputs.push_latest }}" = "true" ]; then
              echo "${{ env.IMAGE_DH }}:latest"
              echo "${{ env.IMAGE_GHCR }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
          push: true
          tags: ${{ steps.tagcalc.outputs.TAGS }}
          build-args: |
            EASYIMAGES_VERSION=${{ steps.vars.outputs.VERSION }}
